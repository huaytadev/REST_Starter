version: "3.9"

services:

  app:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: reststarter-app

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend-network

  postgres:

    image: postgres:18.4

    container_name: reststarter-postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend-network

volumes:

  postgres-data:

networks:

  backend-network:
    driver: bridge